<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL Progressbar — progress bar for FiveM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/><stop offset="0.6" stop-color="#0b1522"/><stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0b2545" stop-opacity="0"/><stop offset="0.25" stop-color="#0ea5e9"/>
      <stop offset="0.45" stop-color="#e9eef5"/><stop offset="0.62" stop-color="#06b6d4"/>
      <stop offset="0.95" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>

  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#topline)"/>
    <rect x="0" y="338" width="1200" height="2" fill="url(#topline)" opacity="0.5"/>

    <g transform="translate(660 60)">
      <!-- engine block -->
      <rect x="40" y="20" width="230" height="120" rx="10" fill="#1e293b" stroke="#ffffff1a" stroke-width="2"/>
      <g fill="#334155"><rect x="62" y="0" width="34" height="30" rx="4"/><rect x="112" y="0" width="34" height="30" rx="4"/>
        <rect x="162" y="0" width="34" height="30" rx="4"/><rect x="212" y="0" width="34" height="30" rx="4"/></g>
      <circle cx="96" cy="84" r="30" fill="#0f172a" stroke="#475569" stroke-width="6"/><circle cx="96" cy="84" r="8" fill="#475569"/>
      <rect x="150" y="60" width="96" height="48" rx="6" fill="#0f172a"/>
      <!-- wrench -->
      <g transform="translate(300 40)"><animateTransform attributeName="transform" type="rotate" values="-14;10;-14" dur="1.2s" additive="sum" repeatCount="indefinite"/>
        <rect x="-8" y="0" width="16" height="110" rx="6" fill="#94a3b8"/>
        <path d="M-22 -6 A 24 24 0 1 0 22 -6 L10 6 L10 -14 L-10 -14 L-10 6 Z" fill="#cbd5e1"/>
      </g>
      <!-- sparks -->
      <g fill="#fbbf24"><circle cx="270" cy="110" r="3"><animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="282" cy="98" r="2"><animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/></circle></g>
      <!-- bar -->
      <g transform="translate(0 176)">
        <rect width="420" height="58" rx="12" fill="#0b1522" stroke="#06b6d466" stroke-width="2"/>
        <text x="20" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#e9eef5">Reparando...</text>
        <text x="400" y="24" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#67e8f9">68%</text>
        <rect x="20" y="34" width="380" height="10" rx="5" fill="#1e293b"/>
        <rect x="20" y="34" width="258" height="10" rx="5" fill="#06b6d4"><animate attributeName="width" values="20;380;20" dur="4s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif">
      <text x="56" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#06b6d4">JVL MEDIACODE</text>
      <text x="56" y="152" font-size="58" font-weight="800" fill="#eef3f9">JVL Progressbar</text>
      <text x="58" y="190" font-size="19" fill="#9fb0c3">Progress bar with animations and callbacks</text>
      <text x="58" y="216" font-size="19" fill="#9fb0c3">Control locks · can draw lib.progressBar</text>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      <rect x="56" y="246" width="98" height="26" rx="13" fill="#06b6d422" stroke="#06b6d4"/><text x="105.0" y="263" text-anchor="middle" fill="#e9eef5">ANIMATIONS</text><rect x="162" y="246" width="90" height="26" rx="13" fill="#06b6d422" stroke="#06b6d4"/><text x="207.0" y="263" text-anchor="middle" fill="#e9eef5">CALLBACKS</text><rect x="260" y="246" width="146" height="26" rx="13" fill="#06b6d422" stroke="#06b6d4"/><text x="333.0" y="263" text-anchor="middle" fill="#e9eef5">DISABLE CONTROLS</text><rect x="414" y="246" width="98" height="26" rx="13" fill="#06b6d422" stroke="#06b6d4"/><text x="463.0" y="263" text-anchor="middle" fill="#e9eef5">STANDALONE</text>
    </g>
  </g>
</svg>
